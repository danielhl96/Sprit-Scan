<app-template-page [NavbarDisabled]="false" [DockDisabled]="false" title="My Custom Title">
  <app-button
    (buttonClick)="toggleModal = !toggleModal"
    [buttonDisabled]="buttonDisabled"
    buttonBorderColor="border-blue-400"
    buttonSize="lg"
    buttonText="Click Me"
  ></app-button>

  <app-input-email [(email)]="email" (emailValidityChange)="emailValid = $event"></app-input-email>

  <app-input-password
    [(password)]="password"
    (passwordValidityChange)="passwordValid = $event"
    placeholder="Please enter your password"
  ></app-input-password>

  @if (toggleModal) {
    <app-modal [(toggleModal)]="toggleModal">
      <p>Modal Content</p>
    </app-modal>
  }
</app-template-page>
