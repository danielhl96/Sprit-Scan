@if (isVisible()) {
  <div
    class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white border-2 rounded-lg shadow-lg p-4 w-50 z-40"
    [class.border-green-500]="notificationType() === 'success'"
    [class.border-red-500]="notificationType() === 'error'"
    [class.border-gray-300]="notificationType() === 'info'"
  >
    <div class="flex justify-between items-center mb-2">
      <h3 class="text-lg text-black font-semibold">Notification</h3>
    </div>
    <p class="text-black text-xs">{{ notificationMessage() }}</p>
  </div>
}
