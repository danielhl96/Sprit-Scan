<div class="flex flex-col items-start">
  <label
    for="email"
    class="flex flex-col items-start gap-1 text-amber-950 font-bold text-sm w-[80dvw]"
  >
    {{ label() }}:
    <div
      class="input flex items-center w-full rounded-xl border border-amber-300/60 bg-amber-50/90 text-amber-950 shadow-sm shadow-amber-900/10 backdrop-blur-sm transition-colors focus-within:border-amber-500"
      [class]="{
        'border-red-400': email() && !checkEmailValidity() && validEmailOn(),
        'border-green-400': email() && checkEmailValidity() && validEmailOn(),
      }"
    >
      <span class="text-amber-800/70">
        <!-- Heroicon: envelope -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
          />
        </svg>
      </span>

      <input
        id="email"
        type="email"
        class="grow placeholder:text-amber-800/50"
        placeholder="E-Mail"
        [value]="email()"
        (input)="onEmailChange($any($event.target).value)"
      />
    </div>
  </label>
  @if (email() && !checkEmailValidity() && validEmailOn()) {
    <span class="text-center text-error text-sm">Invalid email address</span>
  }
</div>
