<label
  class="input bg-black flex border-lg rounded-lg items-center gap-2 w-full"
  [class]="{
    'border-red-400': email && !checkEmailValidity(),
    'border-green-400': email && checkEmailValidity(),
  }"
>
  <span class="text-base-content/60">
    <!-- Heroicon: envelope -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
      />
    </svg>
  </span>

  <input
    type="email"
    class="grow"
    placeholder="E-Mail"
    [value]="email"
    (input)="onEmailChange($any($event.target).value)"
  />
</label>
@if (email && !checkEmailValidity()) {
  <span class="text-center text-error text-sm">Invalid email address</span>
}
