<dialog class="modal" [class.modal-open]="toggleModal()" [open]="toggleModal()">
  <div
    class="modal-box relative overflow-hidden rounded-3xl border border-amber-300/60 bg-gradient-to-br from-amber-50/95 via-orange-50/90 to-amber-100/85 shadow-2xl shadow-amber-900/20 backdrop-blur-md"
  >
    <!-- Dekorativer Akzent-Streifen oben (wie ein Flaschenetikett) -->
    <div
      class="absolute left-0 top-0 h-1 w-full bg-gradient-to-r from-amber-500 via-orange-400 to-amber-600"
    ></div>

    <button
      type="button"
      (click)="toggleChange()"
      class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 text-amber-900/70 hover:bg-amber-200/60 hover:text-amber-950 transition-colors"
    >
      ✕
    </button>
    <ng-content></ng-content>
  </div>

  <!-- Klick auf den Hintergrund schließt das Modal -->
  <form method="dialog" class="modal-backdrop bg-amber-950/40 backdrop-blur-sm">
    <button type="button" (click)="toggleChange()">close</button>
  </form>
</dialog>
