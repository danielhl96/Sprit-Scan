<button
  class="btn rounded-xl border font-semibold tracking-wide text-amber-950 shadow-sm shadow-amber-900/10 backdrop-blur-sm transition-all duration-200 hover:shadow-md hover:shadow-amber-900/20 hover:-translate-y-0.5 active:scale-[0.97] disabled:opacity-60 disabled:shadow-none disabled:translate-y-0"
  [ngClass]="[
    buttonColor(),
    buttonDisabled() || loading() ? 'border-transparent' : buttonBorderColor(),
    'btn-' + buttonSize(),
  ]"
  (click)="onButtonClick()"
  [disabled]="buttonDisabled() || loading()"
>
  @if (loading()) {
    <span class="loading loading-spinner loading-sm"></span>
  } @else {
    @if (buttonSvgPath()) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5"
        [class.text-gray-400]="buttonDisabled()"
      >
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="buttonSvgPath()" />
      </svg>
    }
    @if (buttonImgSrc()) {
      <img
        [src]="buttonImgSrc()"
        [alt]="buttonImgAlt()"
        class="w-5 h-5"
        [class.opacity-40]="buttonDisabled()"
      />
    }
    @if (buttonIcon()) {
      <span [class.text-gray-400]="buttonDisabled()">{{ buttonIcon() }}</span>
    }
    {{ buttonText() }}
  }
</button>
