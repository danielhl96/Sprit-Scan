<button
  class="btn text-black rounded-lg border-1"
  [class]="[
    buttonColor,
    buttonDisabled || loading ? 'border-transparent' : buttonBorderColor,
    'btn-' + buttonSize,
  ]"
  (click)="onButtonClick()"
  [disabled]="buttonDisabled || loading"
>
  @if (loading) {
    <span class="loading loading-spinner loading-sm"></span>
  } @else {
    @if (buttonSvgPath) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5"
        [class.text-gray-400]="buttonDisabled"
      >
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="buttonSvgPath" />
      </svg>
    }
    @if (buttonIcon) {
      <span [class.text-gray-400]="buttonDisabled">{{ buttonIcon }}</span>
    }
    {{ buttonText }}
  }
</button>
