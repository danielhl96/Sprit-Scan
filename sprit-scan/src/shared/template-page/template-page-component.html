@if (isMobile()) {
  <div class="min-h-screen flex flex-col w-[100dvw] h-[100dvh] bg-white">
    <app-navbar [navbarDisabled]="NavbarDisabled"> </app-navbar>

    <div class="flex-1 h-full">
      <div class="pt-12">
        <div class="divider divider-error text-black">{{ title }}</div>
        <ng-content></ng-content>
        <app-dock
          [dockDisabled]="DockDisabled"
          (dockElementClick)="onDockElementClick($event)"
        ></app-dock>
      </div>
    </div>
  </div>
} @else {
  <!-- Desktop / Tablet: Hinweis auf mobile Nutzung -->
  <div class="min-h-screen flex items-center justify-center bg-base-200 p-8">
    <div class="card w-full max-w-xl bg-base-100 shadow-xl">
      <div class="card-body items-center text-center gap-6">
        <div class="text-6xl">📱</div>

        <h1 class="card-title text-3xl">Sprit-Scan is optimized for mobile</h1>

        <p class="text-base-content/70">
          This application is designed for use on a smartphone. Open Sprit-Scan on your phone or
          resize the browser window to continue.
        </p>
      </div>
    </div>
  </div>
}
