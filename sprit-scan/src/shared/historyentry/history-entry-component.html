<div
  class="relative h-[10dvh] w-[40dvw] rounded-2xl border-1 bg-red-50/70 border-red-400 shadow-xl overflow-hidden cursor-pointer flex flex-col items-center justify-center select-none touch-pan-y"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onMove($event)"
  (pointerup)="onPointerUp()"
  (pointercancel)="onPointerUp()"
>
  <!-- Text (blendet beim Ziehen aus) -->
  <div
    class="flex flex-col items-center justify-center transition-opacity duration-75"
    [style.opacity]="textOpacity()"
  >
    <p class="text-black text-center">{{ entryText().substring(0, 20) }}</p>
    <p class="text-black text-xs text-center">{{ entryDate() | date: 'dd.MM.yyyy' }}</p>
  </div>

  <!-- Delete-Icon: wird von rechts hereingeschoben -->
  <div
    class="absolute inset-0 flex items-center justify-center bg-red-100"
    [style.transform]="'translateX(' + iconTranslate() + '%)'"
  >
    <img src="/delete-icon.svg" alt="Delete entry" class="h-[4dvh]" />
  </div>
</div>
