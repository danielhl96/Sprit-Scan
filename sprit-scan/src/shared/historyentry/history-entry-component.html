<div
  class="h-[10dvh] w-[40dvw] rounded-2xl border-1 bg-red-50/70 border-red-400 shadow-xl transition duration-100 ease-in-out cursor-pointer hover:scale-105 hover:shadow-2xl hover:bg-red-100 active:scale-95 flex flex-col items-center justify-center"
  (pointermove)="onMove($event)"
  (pointerdown)="isSet.set(true)"
  (pointerup)="isSet.set(false)"
  (click)="onClick()"
>
  @if (isSet(); as set) {
    <Img src="/delete-icon.svg" alt="Scan Icon" class="h-[4dvh] w-[40dvw]" />
  }
  @if (!isSet(); as set) {
    <p class="text-black text-center">{{ entryText().substring(0, 20) }}</p>
    <p class="text-black text-xs text-center">{{ entryDate() | date: 'dd.MM.yyyy' }}</p>
  }
</div>
