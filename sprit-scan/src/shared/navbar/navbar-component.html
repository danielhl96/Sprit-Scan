<scan-feature></scan-feature>
<div
  class="w-full h-12 top-0 fixed z-50 bg-gradient-to-b from-amber-950 to-amber-900 border-b border-amber-700/50 shadow-md shadow-amber-950/30 backdrop-blur-md"
>
  <div class="flex items-center justify-between h-full px-3">
    <span class="text-lg font-bold text-amber-50">
      <img src="/appicon.svg" alt="Sprit-Scan Logo" class="h-9 w-12" />
    </span>
    @if (!navbarDisabled()) {
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-circle text-amber-100 hover:bg-amber-800/60 mr-0"
        [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <!-- Heroicon: x-mark -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        } @else {
          <!-- Heroicon: bars-3 -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        }
      </button>
    }
  </div>

  @if (menuOpen()) {
    <div
      class="absolute top-12 right-0 w-[60dvw] bg-gradient-to-br from-amber-50/95 to-orange-50/90 backdrop-blur-md border border-amber-300/60 shadow-xl shadow-amber-900/20 rounded-bl-2xl overflow-hidden z-50"
    >
      @for (item of elements(); track item.route) {
        <a
          class="flex items-center gap-3 px-5 py-3 text-amber-950 transition-colors hover:bg-amber-200/60 border-b border-amber-200/60 last:border-b-0"
          [routerLink]="item.route"
          (click)="onElementClick(item)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5 shrink-0 text-amber-700"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          <span class="text-sm font-medium">{{ item.name }}</span>
        </a>
      }
    </div>
  }
</div>
