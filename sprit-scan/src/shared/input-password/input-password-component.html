<label
  class="input bg-black flex border-lg rounded-lg items-center gap-2 w-full"
  [class]="{
    'border-red-400': password && !checkPasswordValidity(),
    'border-green-400': password && checkPasswordValidity(),
  }"
>
  <span class="text-base-content/60">
    <!-- Heroicon: lock -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
      />
    </svg>
  </span>

  <input
    [type]="passwordVisible() ? 'text' : 'password'"
    class="grow"
    [placeholder]="placeholderText"
    [value]="password"
    (input)="onPasswordChange($any($event.target).value)"
  />
</label>

<span (click)="togglePasswordVisibility()" class="text-base-content/60">
  <!-- Heroicon: show hide - toggle -->
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="1.5"
    stroke="currentColor"
    class="w-5 h-5"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
    />
  </svg>
</span>

@if (password && !checkPasswordValidity()) {
  <span class="text-center text-error text-sm">Invalid password</span>
}
