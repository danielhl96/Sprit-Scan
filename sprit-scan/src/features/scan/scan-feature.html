<input
  type="file"
  id="fileInput"
  (change)="handleFileSelected($any($event.target).files[0])"
  accept=".png, .jpg, .jpeg, .webp"
  hidden
/>
<app-scan-animation [imageUrl]="imageUrl()"></app-scan-animation>

<app-modal [toggleModal]="toggleModal()" (toggleModalChange)="toggleModal.set($event)">
  @if (selectedEntry(); as entry) {
    <result [entry]="entry"></result>
  }
</app-modal>
