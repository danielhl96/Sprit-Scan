<app-template-page [NavbarDisabled]="true" [DockDisabled]="true" title="Login">
  <div class="p-5 flex flex-col gap-2 items-center">
    <img src="/appicon-login-landing.svg" alt="Sprit-Scan Login Logo" class="h-45 w-45 mb-5" />

    <app-input-email
      [(email)]="emailinput"
      (emailValidityChange)="emailValid.set($event)"
      [validEmailOn]="false"
    ></app-input-email>

    <app-input-password
      [(password)]="passwordinput"
      [passwordLabel]="'Password'"
      (passwordValidityChange)="passwordValid.set($event)"
      placeholder="Enter your password"
      [passwordValidOn]="false"
    ></app-input-password>
    <div class="flex flex-row gap-1">
      <app-button
        [buttonBorderColor]="'border-amber-400'"
        [buttonColor]="'bg-transparent'"
        [buttonSize]="'sm'"
        [buttonText]="'Login'"
        [buttonDisabled]="isLoading()"
        (buttonClick)="login()"
        [loading]="isLoading()"
        [buttonImgSrc]="'/login-icon.svg'"
        [buttonImgAlt]="'Login'"
      ></app-button>
      <app-button
        (buttonClick)="navigateToRegister()"
        [buttonColor]="'bg-transparent'"
        [buttonImgSrc]="'/register-icon.svg'"
        [buttonImgAlt]="'Register'"
        [buttonBorderColor]="'border-amber-400'"
        [buttonText]="'Sign-up'"
        [buttonSize]="'sm'"
      ></app-button>
    </div>

    <div class="absolute bottom-0">
      <p class="text-sm text-black/50">
        <a class="text-amber-700" href="/privacy-policy">Privacy Policy</a> and
        <a class="text-amber-700" href="/terms-of-service">Terms of Service</a>
      </p>
    </div>
  </div>
</app-template-page>
