<app-template-page [NavbarDisabled]="true" [DockDisabled]="true" title="Login">
  <div class="p-5 flex flex-col gap-2 items-center">
    <img src="/appicon.svg" alt="Sprit-Scan Logo" class="h-40 w-40 mb-5" />

    <app-input-email
      [(email)]="emailinput"
      (emailValidityChange)="emailValid.set($event)"
    ></app-input-email>

    <app-input-password
      [(password)]="passwordinput"
      (passwordValidityChange)="passwordValid.set($event)"
      placeholder="Enter your password"
    ></app-input-password>
    <div class="flex flex-row gap-1">
      <app-button
        [buttonBorderColor]="'border-green-400'"
        [buttonColor]="'bg-transparent'"
        [buttonText]="'Login'"
        [buttonDisabled]="LoginButtonDisabled()"
      ></app-button>
      <app-button
        [buttonColor]="'bg-transparent'"
        [buttonBorderColor]="'border-red-400'"
        [buttonText]="'Sign-up'"
      ></app-button>
    </div>

    <div class="absolute bottom-1">
      <p class="text-sm text-black/50">
        <a class="text-red-400" href="/privacy-policy">Privacy Policy</a> and
        <a class="text-red-400" href="/terms-of-service">Terms of Service</a>.
      </p>
    </div>
  </div>
</app-template-page>
