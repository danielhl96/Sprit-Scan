<app-template-page [NavbarDisabled]="false" [DockDisabled]="false" title="AI-Expert ">
  <div class="flex flex-col gap-6 items-center p-5">
    <div
      #chatContainer
      class="relative flex flex-col gap-5 w-[90dvw] h-[60dvh] rounded-2xl border border-amber-300/60 bg-gradient-to-br from-amber-50/90 via-orange-50/80 to-amber-100/70 shadow-md shadow-amber-900/10 backdrop-blur-sm p-3 overflow-y-auto"
    >
      <chatbubble-component
        [message]="'Hello! I am your AI expert. How can I assist you today?'"
        [isUserMessage]="false"
      ></chatbubble-component>

      @for (message of chatHistory(); track message.id) {
        <chatbubble-component
          [message]="message.message"
          [imageUrl]="message.imageUrl || ''"
          [isUserMessage]="message.isUserMessage"
        ></chatbubble-component>
      }
    </div>

    <div class="flex flex-row gap-1">
      <div class="relative flex items-center">
        <input
          type="text"
          placeholder="Ask a question..."
          class="input flex rounded-xl border border-amber-300/60 bg-amber-50/90 text-amber-950 placeholder:text-amber-800/50 shadow-sm shadow-amber-900/10 backdrop-blur-sm items-center pr-10 focus:border-amber-500 focus:outline-none transition-colors"
          (input)="userInput.set($any($event.target).value)"
          [value]="userInput()"
        />
        <!-- Hidden file input for image upload -->
        <input
          #imageInput
          type="file"
          accept="image/*"
          class="hidden"
          (change)="handleImageSelected($any($event.target).files[0])"
        />
        <!-- Paperclip button -->
        <button
          type="button"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-amber-800/60 hover:text-amber-950 transition cursor-pointer active:scale-95"
          aria-label="Bild hochladen"
          (click)="imageInput.click()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13"
            />
          </svg>
        </button>
      </div>
      <app-button
        [buttonDisabled]="userInput().length === 0"
        [buttonBorderColor]="'border-amber-400'"
        [buttonColor]="'bg-amber-50/80'"
        [buttonSvgPath]="'M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0Z'"
        [buttonSize]="'md'"
        [buttonText]="' '"
        (buttonClick)="setUserInput(userInput())"
      ></app-button>
    </div>
  </div>

  <!-- Loading modal: overlays everything and brings the spinner to the front -->
  @if (isLoading()) {
    <div
      class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-amber-950/50 backdrop-blur-sm"
    >
      <div
        class="w-14 h-14 border-4 border-amber-400 border-t-amber-50 border-b-transparent rounded-full animate-spin"
      ></div>
      <p class="text-amber-50 font-medium">Thinking...</p>
    </div>
  }
</app-template-page>
