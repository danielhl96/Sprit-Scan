<app-template-page [NavbarDisabled]="false" [DockDisabled]="false" title="AI-Expert ">
  <div class="flex flex-col gap-2 items-center p-5">
    <div
      class="flex flex-col w-[90dvw] h-[60dvh] border-1 border-red-400 rounded-md bg-white p-3 overflow-y-auto"
    ></div>

    <div class="flex flex-row gap-0">
      <input
        type="text"
        placeholder="Ask a question..."
        class="input bg-white flex border-lg border-black border-r-0 rounded-l-lg text-black items-center"
      />
      <app-button
        [buttonBorderColor]="'border-black'"
        [buttonColor]="'bg-transparent'"
        [buttonSvgPath]="'M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0Z'"
        [buttonSize]="'md'"
        [buttonText]="' '"
      ></app-button>
    </div>
  </div>
</app-template-page>
