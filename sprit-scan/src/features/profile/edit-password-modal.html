<app-modal [toggleModal]="toggleModal()" (toggleModalChange)="toggleModalChange.emit($event)">
  <div class="flex flex-col gap-3 items-center">
    <app-input-password
      [password]="currentPassword()"
      [passwordLabel]="'Current Password'"
      (passwordChange)="onCurrentPasswordChange($event)"
      [placeholder]="'Your current password'"
      [passwordValidOn]="false"
    ></app-input-password>
    <app-input-password
      [password]="newPassword()"
      [passwordLabel]="'New Password'"
      (passwordChange)="onNewPasswordChange($event)"
      [placeholder]="'Your new password'"
    ></app-input-password>
    <app-input-password
      [password]="confirmPassword()"
      [passwordLabel]="'Confirm New Password'"
      (passwordChange)="onConfirmPasswordChange($event)"
      [placeholder]="'Confirm your new password'"
    ></app-input-password>
    <div class="flex flex-row gap-1">
      <app-button
        buttonText="Password"
        buttonImgSrc="/save-icon.svg"
        buttonColor="btn-success"
        buttonBorderColor="border-success"
        buttonSize="md"
        (buttonClick)="onSavePassword()"
        [buttonDisabled]="
          !checkPasswordMatch() ||
          !checkPasswordNotOldPassword() ||
          !currentPassword() ||
          !newPassword() ||
          !confirmPassword()
        "
      ></app-button>
      <app-button
        buttonText=""
        buttonImgSrc="/cancel-icon.svg"
        buttonColor="btn-ghost"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="toggleModalChange.emit(false)"
      ></app-button>
    </div></div
></app-modal>
