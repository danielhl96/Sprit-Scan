<app-modal [toggleModal]="toggleModal()" (toggleModalChange)="toggleModalChange.emit($event)">
  <div class="flex flex-col gap-3 items-center">
    <p class="text-black text-sm text-center">Enter your password to confirm deletion</p>

    <app-input-password
      [password]="password()"
      (passwordChange)="onPasswordChange($event)"
      [placeholder]="'Your current password'"
      [passwordValidOn]="false"
    ></app-input-password>

    <div class="flex flex-row gap-1">
      <app-button
        buttonText="Account"
        buttonColor="btn-error"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="onConfirmDelete()"
        [buttonDisabled]="!password()"
        buttonImgSrc="/delete-icon.svg"
      ></app-button>

      <app-button
        buttonText=""
        buttonColor="btn-ghost"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="toggleModalChange.emit(false)"
        buttonImgSrc="/cancel-icon.svg"
      ></app-button>
    </div>
  </div>
</app-modal>
