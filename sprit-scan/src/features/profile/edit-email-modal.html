<app-modal [toggleModal]="toggleModal()" (toggleModalChange)="toggleModalChange.emit($event)">
  <div class="flex flex-col gap-3 items-center">
    <app-input-email
      (emailValidityChange)="emailCheck.set($event)"
      [email]="email()"
      (emailChange)="onEmailChange($event)"
    ></app-input-email>
    <app-input-password
      [password]="password()"
      (passwordChange)="onPasswordChange($event)"
      [passwordValidOn]="false"
    ></app-input-password>
    <div class="flex flex-row gap-1">
      <app-button
        buttonText="Email"
        buttonImgSrc="/save-icon.svg"
        buttonColor="btn-ghost"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="onSaveEmail()"
        [buttonDisabled]="!emailCheck() || !password()"
      ></app-button>
      <app-button
        buttonText=""
        buttonImgSrc="/cancel-icon.svg"
        buttonColor="btn-ghost"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="toggleModalChange.emit(false)"
      ></app-button>
    </div>
  </div>
</app-modal>
