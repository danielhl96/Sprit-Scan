<app-template-page [NavbarDisabled]="false" [DockDisabled]="false" title="Your profile">
  <div class="p-5 flex flex-col gap-2 items-center">
    <div
      class="h-[20dvh] w-[80dvw] border-1 border-red-400 rounded-lg flex flex-col items-stretch justify-center px-4 gap-3"
    >
      <div class="flex items-center justify-between">
        <p class="text-black text-sm">Email: {{ profile.email }}</p>
        <button
          type="button"
          class="p-1 rounded-md text-red-700 hover:bg-red-100"
          aria-label="Edit email"
          (click)="onEditEmail()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="editIconPath" />
          </svg>
        </button>
      </div>

      <div class="flex items-center justify-between">
        <p class="text-black text-sm">Password: {{ '*****' }}</p>
        <button
          type="button"
          class="p-1 rounded-md text-red-700 hover:bg-red-100"
          aria-label="Edit password"
          (click)="onEditPassword()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="editIconPath" />
          </svg>
        </button>
      </div>
    </div>
    <app-button
      (buttonClick)="showDeleteModal.set(true)"
      buttonText="Delete account"
      buttonColor="btn-error"
      buttonBorderColor="border-error"
      buttonSize="md"
      buttonSvgPath="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673A2.25 2.25 0 0115.916 21.75H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0V4.875c0-1.242-.91-2.25-2.034-2.25h-3.432c-1.124 0-2.034 1.008-2.034 2.25V5.393m7.5 0a48.667 48.667 0 00-7.5 0"
    ></app-button>
  </div>

  <edit-email-modal
    [toggleModal]="showEmailModal()"
    (toggleModalChange)="showEmailModal.set($event)"
  ></edit-email-modal>

  <edit-password-modal
    [toggleModal]="showPasswordModal()"
    (toggleModalChange)="showPasswordModal.set($event)"
  ></edit-password-modal>

  <delete-modal
    [toggleModal]="showDeleteModal()"
    (toggleModalChange)="showDeleteModal.set($event)"
  ></delete-modal>
</app-template-page>
