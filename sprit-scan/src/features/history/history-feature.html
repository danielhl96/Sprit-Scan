<app-template-page title="History" [NavbarDisabled]="false" [DockDisabled]="false">
  <div class="flex flex-col gap-2 items-center w-full p-5">
    <div class="relative w-[75dvw] mb-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5 text-gray-500 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m21 21-4.35-4.35m1.85-5.4a7.25 7.25 0 1 1-14.5 0 7.25 7.25 0 0 1 14.5 0Z"
        />
      </svg>

      <input
        type="text"
        placeholder="Search..."
        class="w-full text-black pl-10 pr-2 py-2 border-2 border-black rounded-lg"
        (input)="inputSearchValue($any($event.target).value)"
      />
    </div>
    @if (HistoryEntry().length > 0) {
      <div class="overflow-y-auto max-h-[60dvh]">
        <div class="grid grid-cols-2 grid-rows-2 gap-3 max-w-full">
          @for (entry of HistoryEntry(); track entry.id) {
            <history-entry-component
              [entryText]="entry.name"
              [entryDate]="entry.date"
              (click)="selectedEntry.set(entry); toggleModal.set(true)"
            ></history-entry-component>
          }
        </div>
      </div>
    } @else {
      <p class="text-black text-center">No history entries yet</p>
    }
  </div>

  <app-modal [toggleModal]="toggleModal()" (toggleModalChange)="toggleModal.set($event)">
    <div class="flex flex-col items-center gap-1">
      @if (selectedEntry(); as entry) {
        <result [entry]="entry"></result>
      }
      <app-button
        buttonText="Delete"
        buttonImgSrc="/delete-icon.svg"
        buttonColor="btn-ghost"
        buttonBorderColor="border-error"
        buttonSize="md"
        (buttonClick)="deleteEntry(selectedEntry()!.id); toggleModal.set(false)"
      ></app-button>
    </div>
  </app-modal>
</app-template-page>
