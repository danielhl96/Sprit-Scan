<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Glas -->
    <linearGradient id="bottle" x2="1" y2="0">
      <stop stop-color="#f8d08a" />
      <stop offset=".5" stop-color="#e2a04a" />
      <stop offset="1" stop-color="#b9691f" />
    </linearGradient>

    <!-- Whisky -->
    <linearGradient id="liquid" x2="1" y2="1">
      <stop stop-color="#e08a2c" />
      <stop offset=".5" stop-color="#a8501a" />
      <stop offset="1" stop-color="#5e2608" />
    </linearGradient>

    <!-- Gold (Folie, Akzente) -->
    <linearGradient id="gold" x2="1" y2="0">
      <stop stop-color="#b8862f" />
      <stop offset=".5" stop-color="#fde08a" />
      <stop offset="1" stop-color="#b8862f" />
    </linearGradient>

    <!-- Etikett -->
    <linearGradient id="label" x2="0" y2="1">
      <stop stop-color="#fdf6dc" />
      <stop offset="1" stop-color="#efdfae" />
    </linearGradient>

    <!-- Handy-Rahmen (Titan) -->
    <linearGradient id="phone" x2="1" y2="1">
      <stop stop-color="#8a8580" />
      <stop offset=".5" stop-color="#2a2826" />
      <stop offset="1" stop-color="#6b6661" />
    </linearGradient>

    <!-- Display (helle App-Ansicht) -->
    <linearGradient id="screen" x2="0" y2="1">
      <stop stop-color="#fffaf0" />
      <stop offset="1" stop-color="#fbe3ae" />
    </linearGradient>

    <!-- Formen -->
    <path
      id="bottleShape"
      d="M192 108 H248 V172 C248 200 300 208 300 252 V398 Q300 426 272 426 H168 Q140 426 140 398 V252 C140 208 192 200 192 172 Z"
    />
    <path
      id="miniBottle"
      d="M351 204 h10 v16 c0 8 10 10 10 22 v42 q0 6 -6 6 h-18 q-6 0 -6 -6 v-42 c0 -12 10 -14 10 -22 z"
    />
    <clipPath id="bottleClip"><use href="#bottleShape" /></clipPath>
    <clipPath id="screenClip"><rect x="299" y="149" width="114" height="244" rx="22" /></clipPath>

    <!-- Login-Badge -->
    <linearGradient id="loginBadge" x2="1" y2="1">
      <stop stop-color="#f59e0b" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".18" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f2b45d" flood-opacity=".18" />
    </filter>
  </defs>

  <!-- Bodenschatten -->
  <ellipse cx="220" cy="436" rx="104" ry="16" fill="#000" opacity=".16" />
  <ellipse cx="372" cy="410" rx="74" ry="11" fill="#000" opacity=".14" />

  <!-- ============ FLASCHE ============ -->
  <g filter="url(#softGlow)">
    <!-- Glas -->
    <use href="#bottleShape" fill="url(#bottle)" />

    <!-- Whisky-Füllung -->
    <g clip-path="url(#bottleClip)">
      <rect x="136" y="226" width="168" height="204" fill="url(#liquid)" />
      <rect x="136" y="226" width="168" height="4" fill="#fde08a" opacity=".55" />
      <rect x="272" y="200" width="32" height="230" fill="#3a1605" opacity=".28" />
      <ellipse cx="220" cy="426" rx="70" ry="10" fill="#3a1605" opacity=".35" />
    </g>

    <!-- Kontur -->
    <use href="#bottleShape" stroke="#24170c" stroke-width="5" stroke-linejoin="round" />

    <!-- Lichtreflexe -->
    <path d="M158 256 V392" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".3" />
    <path d="M172 236 V246" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".3" />
    <path d="M203 140 V176" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".35" />

    <!-- Goldfolie am Hals -->
    <rect x="190" y="104" width="60" height="30" fill="url(#gold)" stroke="#24170c" stroke-width="4" />
    <path d="M190 126 H250" stroke="#8a5a1c" stroke-width="2" />

    <!-- Verschluss -->
    <rect x="186" y="60" width="68" height="46" rx="8" fill="#2b1a0e" stroke="#24170c" stroke-width="4" />
    <path d="M200 68 V98 M212 68 V98 M224 68 V98 M236 68 V98" stroke="#4a2f1a" stroke-width="3" stroke-linecap="round" />
    <path d="M188 98 H252" stroke="url(#gold)" stroke-width="3" />

    <!-- Etikett -->
    <rect x="154" y="258" width="132" height="118" rx="10" fill="url(#label)" stroke="#24170c" stroke-width="4" />
    <rect x="161" y="265" width="118" height="104" rx="6" stroke="#b8862f" stroke-width="1.5" />

    <!-- Emblem -->
    <path d="M220 272 l5 6 -5 6 -5 -6 z" fill="#b8862f" />
    <path d="M192 278 H209 M231 278 H248" stroke="#b8862f" stroke-width="1.5" stroke-linecap="round" />

    <!-- Schriftzug -->
    <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
      <text x="221" y="310" font-size="24" font-weight="700" letter-spacing="3" fill="#3a1f0b">SPRIT</text>
      <path d="M180 318 H260" stroke="#b8862f" stroke-width="1.2" />
      <circle cx="220" cy="318" r="2.2" fill="#b8862f" />
      <text x="221" y="332" font-size="9" font-weight="700" letter-spacing="2" fill="#7a4a14">SINGLE MALT</text>
      <text x="221" y="344" font-size="6.5" letter-spacing="1.5" fill="#7a4a14">AGED 12 YEARS</text>

      <!-- Banderole -->
      <rect x="161" y="351" width="118" height="14" fill="#78350f" />
      <text x="220" y="361" font-size="7" letter-spacing="1" fill="#fde9b0">40% VOL · 0,7 L</text>
    </g>
  </g>

  <!-- ============ IPHONE ============ -->
  <g transform="translate(8 -2)">
    <g filter="url(#shadow)">
      <!-- Seitentasten -->
      <rect x="287" y="196" width="4" height="14" rx="2" fill="#4a4643" />
      <rect x="287" y="218" width="4" height="24" rx="2" fill="#4a4643" />
      <rect x="287" y="248" width="4" height="24" rx="2" fill="#4a4643" />
      <rect x="421" y="226" width="4" height="38" rx="2" fill="#4a4643" />

      <!-- Rahmen + Bezel -->
      <rect x="290" y="140" width="132" height="262" rx="31" fill="url(#phone)" stroke="#111" stroke-width="3" />
      <rect x="295" y="145" width="122" height="252" rx="26" fill="#050505" />
    </g>

    <!-- Display -->
    <g clip-path="url(#screenClip)" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
      <rect x="299" y="149" width="114" height="244" fill="url(#screen)" />

      <!-- Statusleiste -->
      <text x="311" y="165" font-size="8" font-weight="700" fill="#3a1f0b">9:41</text>
      <rect x="337" y="156" width="38" height="11" rx="5.5" fill="#000" />
      <circle cx="367" cy="161.5" r="2" fill="#1c1c2e" />
      <path d="M381 165 v-2 M384 165 v-4 M387 165 v-6" stroke="#3a1f0b" stroke-width="1.8" stroke-linecap="round" />
      <rect x="391.5" y="158.5" width="12" height="6.5" rx="2" stroke="#3a1f0b" stroke-width="1" opacity=".8" />
      <rect x="393" y="160" width="7" height="3.5" rx="1" fill="#3a1f0b" />
      <rect x="404.5" y="160.5" width="1.5" height="2.5" rx=".7" fill="#3a1f0b" opacity=".8" />

      <!-- App-Logo -->
      <circle cx="356" cy="200" r="16" fill="url(#gold)" stroke="#8a5a1c" stroke-width="1.2" />
      <use href="#miniBottle" transform="translate(249.2 125.9) scale(.3)" fill="#3a1f0b" />

      <!-- Titel -->
      <g text-anchor="middle">
        <text x="356" y="232" font-size="9" font-weight="700" fill="#3a1f0b">Welcome back</text>
        <text x="356" y="242" font-size="5.5" fill="#8a6a45">Sign in to Sprit-Scan</text>
      </g>

      <!-- E-Mail-Feld -->
      <rect x="311" y="250" width="90" height="22" rx="8" fill="#fff" stroke="#e6c988" stroke-width="1.2" />
      <rect x="317" y="257" width="10" height="8" rx="1.5" stroke="#b8862f" stroke-width="1.2" />
      <path d="M317.5 258 l4.5 3.5 l4.5 -3.5" stroke="#b8862f" stroke-width="1.2" stroke-linejoin="round" />
      <text x="332" y="263.5" font-size="6.5" fill="#3a1f0b">mail@sprit.de</text>

      <!-- Passwort-Feld (fokussiert) -->
      <rect x="311" y="278" width="90" height="22" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.6" />
      <rect x="318" y="288" width="8" height="6.5" rx="1.5" fill="#b8862f" />
      <path d="M319.8 288 v-2 a2.2 2.2 0 0 1 4.4 0 v2" stroke="#b8862f" stroke-width="1.2" />
      <g fill="#3a1f0b">
        <circle cx="334" cy="289" r="1.6" />
        <circle cx="340" cy="289" r="1.6" />
        <circle cx="346" cy="289" r="1.6" />
        <circle cx="352" cy="289" r="1.6" />
        <circle cx="358" cy="289" r="1.6" />
        <circle cx="364" cy="289" r="1.6" />
      </g>
      <path d="M385 289 q5 -5 10 0 q-5 5 -10 0 z" stroke="#b8862f" stroke-width="1" stroke-linejoin="round" />
      <circle cx="390" cy="289" r="1.3" fill="#b8862f" />

      <text x="401" y="310" font-size="5" fill="#b45309" text-anchor="end">Forgot password?</text>

      <!-- Login-Button -->
      <rect x="311" y="318" width="90" height="24" rx="12" fill="url(#gold)" stroke="#8a5a1c" stroke-width="1" />
      <text x="350" y="333" font-size="8.5" font-weight="700" fill="#3a1f0b" text-anchor="middle">Login</text>
      <path d="M368 330 h8 m-3 -3 l3 3 l-3 3" stroke="#3a1f0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Trenner + Registrieren -->
      <path d="M316 355 H346 M366 355 H396" stroke="#d9b877" stroke-width="1" stroke-linecap="round" />
      <g text-anchor="middle">
        <text x="356" y="357" font-size="5" fill="#8a6a45">or</text>
        <text x="356" y="372" font-size="6" font-weight="700" fill="#b45309">Create account</text>
      </g>

      <!-- Home-Indikator -->
      <rect x="338" y="387" width="36" height="3" rx="1.5" fill="#3a1f0b" opacity=".5" />

      <!-- Display-Spiegelung -->
      <path d="M299 149 H360 L299 290 Z" fill="#fff" opacity=".18" />
    </g>
  </g>

  <!-- Login-Indikator: Enter-Symbol -->
  <circle cx="440" cy="404" r="22" fill="url(#loginBadge)" stroke="#fff" stroke-width="4" filter="url(#shadow)" />
  <path d="M429 404 H449 M442 396 L450 404 L442 412" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
