<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f2b45d"/>
      <stop offset="1" stop-color="#9b4b15"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- subtle shadow -->
  <ellipse cx="256" cy="460" rx="120" ry="18" fill="#000" opacity=".12" filter="url(#s)"/>

  <!-- bottle body -->
  <g stroke="#2b2117" stroke-width="6">
    <path d="M180 140 C160 200 160 360 256 380 C352 360 352 200 332 140 Z" fill="url(#g1)"/>

    <!-- neck -->
    <rect x="230" y="70" width="52" height="70" rx="6" fill="#9b4b15" />

    <!-- cork -->
    <rect x="238" y="40" width="36" height="30" rx="4" fill="#2b2117" />

    <!-- label -->
    <rect x="210" y="220" width="92" height="80" rx="8" fill="#f7edc8"/>
  </g>
</svg>
