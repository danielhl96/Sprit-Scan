<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Glas -->
    <linearGradient id="bottle" x2="1" y2="1">
      <stop stop-color="#f2b45d" />
      <stop offset=".45" stop-color="#9b4b15" />
      <stop offset="1" stop-color="#5e2608" />
    </linearGradient>

    <!-- Handy -->
    <linearGradient id="phone" x2="1" y2="1">
      <stop stop-color="#555" />
      <stop offset=".5" stop-color="#111" />
      <stop offset="1" stop-color="#333" />
    </linearGradient>

    <!-- Register-Badge -->
    <linearGradient id="registerBadge" x2="1" y2="1">
      <stop stop-color="#ef4444" />
      <stop offset="1" stop-color="#991b1b" />
    </linearGradient>

    <!-- Schatten -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".18" />
    </filter>

    <!-- Leichter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f2b45d" flood-opacity=".18" />
    </filter>
  </defs>

  <!-- Schatten Flasche -->
  <ellipse cx="205" cy="430" rx="108" ry="22" fill="#000" opacity=".14" filter="url(#shadow)" />

  <!-- Flasche -->
  <g stroke="#24170c" stroke-width="6" filter="url(#softGlow)">
    <path
      d="M140 190 C120 230 125 390 150 415 C175 440 265 440 290 415 C315 390 320 230 300 190 Z"
      fill="url(#bottle)"
    />

    <!-- Hals -->
    <path d="M185 190 L185 105 Q220 75 255 105 L255 190 Z" fill="url(#bottle)" />

    <!-- Korken -->
    <rect x="193" y="65" width="54" height="40" rx="8" fill="#2b2117" />

    <!-- Etikett -->
    <rect x="155" y="255" width="130" height="90" rx="10" fill="#f7edc8" />
  </g>

  <!-- iPhone ähnliches Gerät -->
  <g stroke="#111" stroke-width="6" filter="url(#shadow)">
    <rect x="292" y="148" width="126" height="248" rx="34" fill="url(#phone)" />

    <!-- Display -->
    <rect x="306" y="163" width="98" height="212" rx="24" fill="#9edcf0" />

    <!-- Dynamic Island -->
    <rect x="333" y="178" width="45" height="12" rx="8" fill="#050505" />

    <!-- Anmeldung: Avatar -->
    <circle cx="355" cy="224" r="14" fill="#e8f6fb" stroke="#ffffff" stroke-width="3" />
    <path d="M336 250 C342 240 368 240 374 250" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Anmeldung: Eingabefelder -->
    <rect x="322" y="262" width="66" height="16" rx="7" fill="#dff3fa" stroke="#ffffff" stroke-width="3" />
    <rect x="322" y="287" width="66" height="16" rx="7" fill="#dff3fa" stroke="#ffffff" stroke-width="3" />

    <!-- Anmeldung: Passwort (Lock) -->
    <rect x="344" y="313" width="22" height="16" rx="4" fill="#ffffff" stroke="#e53935" stroke-width="3" />
    <path d="M348 313 V309 C348 304 352 300 355 300 C358 300 362 304 362 309 V313" stroke="#e53935" stroke-width="3" stroke-linecap="round" />

    <!-- Anmeldung: Zustimmung Checkbox -->
    <rect x="324" y="338" width="14" height="14" rx="3" fill="#ffffff" stroke="#35c759" stroke-width="3" />
    <path d="M327 345 L331 349 L336 342" stroke="#35c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="343" y1="345" x2="384" y2="345" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Datenfluss Verbindung -->
  <line x1="285" y1="302" x2="323" y2="282" stroke="#ff3030" stroke-width="4" stroke-linecap="round" />

  <!-- Register-Indikator (Plus) -->
  <circle cx="432" cy="410" r="24" fill="url(#registerBadge)" filter="url(#shadow)" />
  <path
    d="M432 397 V423 M419 410 H445"
    stroke="white"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
