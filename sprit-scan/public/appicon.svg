<svg width="512" height="512" viewBox="0 0 512 512"
xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Button Hintergrund -->
<linearGradient id="bg" x2="0" y2="1">
 <stop stop-color="#f8f5ed"/>
 <stop offset="1" stop-color="#ddd2b8"/>
</linearGradient>

<!-- Glas -->
<linearGradient id="bottle" x2="1" y2="1">
 <stop stop-color="#f2b45d"/>
 <stop offset=".45" stop-color="#9b4b15"/>
 <stop offset="1" stop-color="#5e2608"/>
</linearGradient>

<!-- Handy -->
<linearGradient id="phone" x2="1" y2="1">
 <stop stop-color="#555"/>
 <stop offset=".5" stop-color="#111"/>
 <stop offset="1" stop-color="#333"/>
</linearGradient>

<!-- Schatten -->
<filter id="shadow">
 <feGaussianBlur stdDeviation="8"/>
</filter>

</defs>


<!-- App Button -->
<rect x="20" y="20"
width="472"
height="472"
rx="90"
fill="url(#bg)"/>


<!-- Schatten Flasche -->
<ellipse cx="210"
cy="430"
rx="120"
ry="25"
fill="#000"
opacity=".18"
filter="url(#shadow)"/>


<!-- Flasche -->
<g stroke="#24170c" stroke-width="6">

<path d="
M145 190
C125 230 130 390 155 415
C180 440 270 440 295 415
C320 390 325 230 305 190Z"
fill="url(#bottle)"/>


<!-- Hals -->
<path d="
M190 190
L190 105
Q225 75 260 105
L260 190Z"
fill="url(#bottle)"/>


<!-- Korken -->
<rect x="198"
y="65"
width="54"
height="40"
rx="8"
fill="#2b2117"/>


<!-- Etikett -->
<rect x="160"
y="255"
width="130"
height="90"
rx="10"
fill="#f7edc8"/>


</g>


<!-- iPhone ähnliches Gerät -->

<g stroke="#111" stroke-width="6">


<rect x="300"
y="150"
width="120"
height="240"
rx="32"
fill="url(#phone)"/>


<!-- Display -->
<rect x="313"
y="165"
width="94"
height="205"
rx="22"
fill="#9edcf0"/>


<!-- Dynamic Island -->
<rect x="340"
y="180"
width="45"
height="12"
rx="8"
fill="#050505"/>


<!-- Scan Rahmen -->
<rect x="330"
y="245"
width="60"
height="75"
rx="5"
fill="none"
stroke="white"
stroke-width="4"/>


<!-- Scanlinie -->
<line x1="330"
y1="280"
x2="390"
y2="280"
stroke="#ff3030"
stroke-width="5"/>


</g>


<!-- Scan Verbindung -->
<line x1="290"
y1="300"
x2="330"
y2="280"
stroke="#ff3030"
stroke-width="4"/>


<!-- kleiner Funktionsindikator -->
<circle cx="430"
cy="410"
r="22"
fill="#35c759"/>

<path d="
M420 410
L428 418
L443 398"
fill="none"
stroke="white"
stroke-width="5"
stroke-linecap="round"/>


</svg>