name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sprit-scan/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sprit-scan/backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run tests (without E2E)
        run: npm test -- --testPathIgnorePatterns=src/test/e2e.spec.ts

  e2e:
    runs-on: ubuntu-latest
    needs: unit-integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sprit-scan/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: sprit-scan/backend
        run: npm install

      - name: Start test stack
        run: docker compose -f docker-compose-test.yml up -d --build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Wait for gateway
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$code" = "200" ] || [ "$code" = "429" ]; then
              echo "Gateway ready with status $code"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway not ready in time"
          docker compose -f docker-compose-test.yml logs
          exit 1

      - name: Run E2E tests
        working-directory: sprit-scan/backend
        run: npm test -- src/test/e2e.spec.ts

      - name: Print compose logs on failure
        if: failure()
        run: docker compose -f docker-compose-test.yml logs --no-color

      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
