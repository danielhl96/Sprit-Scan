version: '3.9'

services:

  # ─────────────────────────────────────────
  # FRONTEND (Angular)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./sprit-scan
      dockerfile: Dockerfile
    ports:
      - '4200:4200'
    volumes:
      - ./sprit-scan:/app
      - /app/node_modules
    networks:
      - external
    depends_on:
      - api-gateway

  # ─────────────────────────────────────────
  # API GATEWAY – einziger öffentlicher Eingang
  # ─────────────────────────────────────────
  api-gateway:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JWT_SECRET=your_jwt_secret_key_here
      - HISTORY_SERVICE_URL=http://history-service:3003
      - AI_SERVICE_URL=http://ai-service:3004
      - REDIS_URL=redis://redis:6379
      - HTTP_TIMEOUT=5000
    networks:
      - external
      - internal
    depends_on:
      - auth-service
      - history-service
      - ai-service
    command: sh -c "node --watch -r ts-node/register -r tsconfig-paths/register src/api-gateway/main.ts"

  # ─────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────
  auth-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=your_jwt_secret_key_here
      - DATABASE_URL=postgresql://authuser:authpassword@auth-db:5432/auth-db?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - auth-db
      - redis
    command: sh -c "npx prisma generate && npx prisma db push && node --watch -r ts-node/register -r tsconfig-paths/register src/auth-microservice/main.ts"

  # ─────────────────────────────────────────
  # HISTORY SERVICE
  # ─────────────────────────────────────────
  history-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL_HISTORY=postgresql://historyuser:historypassword@history-db:5432/history-db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_key_here
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - history-db
      - redis
    command: sh -c "node node_modules/prisma/build/index.js generate --schema src/history-microservice/prisma/schema.prisma && node node_modules/prisma/build/index.js db push --schema src/history-microservice/prisma/schema.prisma && node --watch -r ts-node/register -r tsconfig-paths/register src/history-microservice/main.ts"

  # ─────────────────────────────────────────
  # AI SERVICE
  # ─────────────────────────────────────────
  ai-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3004
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_key_here
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - external
    depends_on:
      - redis
    command: sh -c "node --watch -r ts-node/register -r tsconfig-paths/register src/ai-microservice/main.ts"

  # ─────────────────────────────────────────
  # DATENBANKEN (je Service eine eigene)
  # ─────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth-db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal


  history-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: historyuser
      POSTGRES_PASSWORD: historypassword
      POSTGRES_DB: history-db
    volumes:
      - history-db-data:/var/lib/postgresql/data
    networks:
      - internal

  # ─────────────────────────────────────────
  # REDIS – Session / Cache / Message Bus
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - internal

# Networks
networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true

# Volumes
volumes:
  auth-db-data:
  history-db-data: