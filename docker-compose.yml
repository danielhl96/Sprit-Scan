version: '3.9'

services:

  # ─────────────────────────────────────────
  # FRONTEND (Angular)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./sprit-scan
      dockerfile: Dockerfile
    ports:
      - '4200:4200'
    volumes:
      - ./sprit-scan:/app
      - /app/node_modules
    networks:
      - external
    depends_on:
      - api-gateway

  # ─────────────────────────────────────────
  # API GATEWAY – einziger öffentlicher Eingang
  # ─────────────────────────────────────────
  api-gateway:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CORS_ORIGIN=http://localhost:4200
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PROFILE_SERVICE_URL=http://profile-service:3002
      - HISTORY_SERVICE_URL=http://history-service:3003
      - AI_SERVICE_URL=http://ai-service:3004
      - HTTP_TIMEOUT=5000
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - external
      - internal
    depends_on:
      - auth-service
      - profile-service
      - history-service
      - ai-service
    command: npm run start:dev

  # ─────────────────────────────────────────
  # AUTH SERVICE
  # ─────────────────────────────────────────
  auth-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://authuser:authpassword@auth-db:5432/auth-db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=changeme
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - auth-db
      - redis
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:dev"

  # ─────────────────────────────────────────
  # PROFILE SERVICE
  # ─────────────────────────────────────────
  profile-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://profileuser:profilepassword@profile-db:5432/profile-db?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - profile-db
      - redis
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:dev"

  # ─────────────────────────────────────────
  # HISTORY SERVICE
  # ─────────────────────────────────────────
  history-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://historyuser:historypassword@history-db:5432/history-db?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - history-db
      - redis
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:dev"

  # ─────────────────────────────────────────
  # AI SERVICE
  # ─────────────────────────────────────────
  ai-service:
    build:
      context: ./sprit-scan/backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3004
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./sprit-scan/backend:/app
      - /app/node_modules
    networks:
      - internal
    depends_on:
      - redis
    command: npm run start:dev

  # ─────────────────────────────────────────
  # DATENBANKEN (je Service eine eigene)
  # ─────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth-db
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - internal

  profile-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: profileuser
      POSTGRES_PASSWORD: profilepassword
      POSTGRES_DB: profile-db
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    networks:
      - internal

  history-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: historyuser
      POSTGRES_PASSWORD: historypassword
      POSTGRES_DB: history-db
    volumes:
      - history-db-data:/var/lib/postgresql/data
    networks:
      - internal

  # ─────────────────────────────────────────
  # REDIS – Session / Cache / Message Bus
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks:
      - internal

# ─────────────────────────────────────────
# NETZWERKE
# ─────────────────────────────────────────
networks:
  external:   # Frontend ↔ API Gateway
  internal:   # Nur Service-zu-Service, nicht von außen erreichbar

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes:
  auth-db-data:
  profile-db-data:
  history-db-data: